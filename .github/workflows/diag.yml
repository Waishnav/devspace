name: Diag
on:
  pull_request:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep bubblewrap socat apparmor-utils
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          SEC=$(ls -d node_modules/.pnpm/@anthropic-ai+sandbox-runtime@*/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp)
          probe() { echo "=== $1"; bwrap --unshare-user --unshare-pid --cap-drop ALL --ro-bind / / --proc /proc "$SEC" true; echo "rc=$?"; }
          P=/etc/apparmor.d/bwrap-userns-restrict
          echo "### V1: profile removed, sysctls untouched (userns=1)"
          sudo apparmor_parser -R $P; probe v1
          sudo apparmor_parser -r $P
          echo "### V2: profile removed, restrict_unprivileged_userns=0 only"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; sudo apparmor_parser -R $P; probe v2
          sudo apparmor_parser -r $P
          echo "### V3: profile loaded, both sysctls 0 (current CI + unconfined)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0; probe v3
          echo "### V4: profile removed, both sysctls 0"
          sudo apparmor_parser -R $P; probe v4
          echo "aa-status bwrap:"; sudo aa-status | grep -c bwrap
          echo "### V5: aa-disable style (symlink to disable/) is persistent variant"
          sudo apparmor_parser -r $P
          sudo ln -sf $P /etc/apparmor.d/disable/ ; sudo apparmor_parser -R $P; probe v5
